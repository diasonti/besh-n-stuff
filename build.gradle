plugins {
    id "java-library"
    id "idea"
    id "net.neoforged.moddev" version "2.0.146"
}

version = mod_version
group = mod_group_id

var integrationMods = [
        farmersdelight: [
                dependency: "maven.modrinth:farmers-delight:1.21.1-1.3.4",
                sha512: "1f6f8796469f747cff36f477b4f589a3d69613882399f9ee7f86db36c7bca9aa4828731f43db15dc6c7f5a4c1bbe3d4092a232e8cef010b09cec0581848fda90"
        ]
]

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup("maven.modrinth")
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    integrationRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations.integrationTestImplementation.extendsFrom(configurations.implementation, configurations.integrationRuntime)
configurations.integrationTestRuntimeOnly.extendsFrom(configurations.runtimeOnly)

var verifyIntegrationRuntime = tasks.register("verifyIntegrationRuntime") {
    group = "verification"
    description = "Verifies all pinned integration test dependencies."
    inputs.files(configurations.integrationRuntime)
    inputs.property("checksums", integrationMods.collectEntries { modId, mod -> [(modId): mod.sha512] })
    doLast { task ->
        var expectedChecksums = task.inputs.properties["checksums"].values().toSet()
        var actualChecksums = task.inputs.files.collect { file ->
            var checksum = java.security.MessageDigest.getInstance("SHA-512")
                    .digest(file.bytes).encodeHex().toString()
            if (!expectedChecksums.contains(checksum)) {
                throw new GradleException("Integration test dependency SHA-512 checksum mismatch: ${file.name}")
            }
            checksum
        }.toSet()
        if (actualChecksums != expectedChecksums) {
            throw new GradleException("Integration runtime is missing pinned test dependencies")
        }
    }
}

neoForge {
    // The version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        // Each local mod group combines main resources with only its own test classes.
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.test)
        }
        "${mod_id}_integration" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.integrationTest)
        }
    }

    runs {
        configureEach {
            loadedMods = [project.neoForge.mods.getByName(project.mod_id)]
        }

        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        }

        server {
            server()
            programArgument "--nogui"
            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.test
            systemProperty "neoforge.enabledGameTestNamespaces", "${project.mod_id},minecraft"
        }

        integrationGameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.integrationTest
            gameDirectory = project.file("runs/integration")
            loadedMods = [project.neoForge.mods.getByName("${project.mod_id}_integration")]
            systemProperty "neoforge.enabledGameTestNamespaces", "${project.mod_id},minecraft"
            taskBefore verifyIntegrationRuntime
        }

        data {
            data()
            programArguments.addAll "--mod", project.mod_id, "--all", "--output", file("src/generated/resources/").getAbsolutePath(), "--existing", file("src/main/resources/").getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty "forge.logging.markers", "REGISTRIES"
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    addModdingDependenciesTo(sourceSets.test)
    addModdingDependenciesTo(sourceSets.integrationTest)
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir "src/generated/resources" }


dependencies {
    integrationMods.values().each { mod ->
        integrationRuntime(mod.dependency) {
            transitive = false
        }
    }
}

// Replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
